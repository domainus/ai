[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "domainus-ai-research"
version = "0.1.0"
description = "Autonomous verifiable AI research — open experiments, low-precision polar optimization, Blackwell/MLX kernels, and adversarially audited discoveries"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
include = ["research*", "reports*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
